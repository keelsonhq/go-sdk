name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25"
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          formatted="$(gofmt -l .)"
          if [ -n "$formatted" ]; then
            printf '%s\n' "$formatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
