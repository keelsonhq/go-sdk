name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          formatted="$(gofmt -l .)"
          if [ -n "$formatted" ]; then
            printf '%s\n' "$formatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
